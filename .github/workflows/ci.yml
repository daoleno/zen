name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  daemon:
    name: Daemon (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -o bin/zen ./cmd/zen/

  app:
    name: App (Bun / Expo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun test
        working-directory: app
      - name: Typecheck
        run: bunx tsc --noEmit
        working-directory: app
      - name: Android export
        run: bunx expo export --platform android
        working-directory: app

  native-contract:
    name: Native terminal contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify lock/notice/scripts (no .so required)
        run: ./scripts/verify-libghostty.sh --contract
