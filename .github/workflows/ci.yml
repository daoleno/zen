name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Installer (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Test secure bootstrap installer
        run: bun run installer:test

  daemon:
    name: Daemon (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -o bin/zen ./cmd/zen/

  app:
    name: App (Bun / Expo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun test
        working-directory: app
      - name: Typecheck
        run: bunx tsc --noEmit
        working-directory: app
      - name: Android export
        run: bunx expo export --platform android
        working-directory: app
      - name: iOS export
        run: bunx expo export --platform ios
        working-directory: app

  ios-native:
    name: iOS native (unsigned Simulator)
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Require Apple build tools
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-path
          command -v pod >/dev/null || {
            echo "error: CocoaPods is required on the macOS runner" >&2
            exit 1
          }
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Verify shared native contract
        run: ./scripts/verify-libghostty.sh --contract
      - name: Build and verify iOS Ghostty XCFramework
        env:
          ZEN_GHOSTTY_CACHE: ${{ runner.temp }}/ghostty
          ZEN_TOOL_CACHE: ${{ runner.temp }}/zen-tools
        run: ./scripts/build-libghostty-ios.sh
      - name: Generate iOS project and install pods
        run: |
          set -euo pipefail
          cd app
          bunx expo prebuild --platform ios --clean --no-install
          cd ios
          pod install
      - name: Build unsigned Simulator app
        env:
          DERIVED_DATA: ${{ runner.temp }}/zen-ios-derived
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild \
            -workspace app/ios/Zen.xcworkspace \
            -scheme Zen \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            build
          APP="$DERIVED_DATA/Build/Products/Debug-iphonesimulator/Zen.app"
          ./scripts/verify-ios-artifact.sh simulator "$APP"
          echo "IOS_SIMULATOR_APP=$APP" >> "$GITHUB_ENV"
      - name: Upload unsigned Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: zen-ios-simulator-${{ github.sha }}
          path: ${{ env.IOS_SIMULATOR_APP }}
          if-no-files-found: error
          retention-days: 7

  native-contract:
    name: Native terminal contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify lock/notice/scripts (no .so required)
        run: ./scripts/verify-libghostty.sh --contract

  release-identity:
    name: Release identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify package / version / versionCode sources
        run: ./scripts/verify-release-identity.sh
