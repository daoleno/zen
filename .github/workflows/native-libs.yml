name: Native libs (libghostty-vt)

# Optional / release path: builds pinned Ghostty VT Android libraries.
# Not part of default PR CI (Zig + Ghostty compile is heavy).
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: native-libs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-libghostty:
    name: Build Android libghostty-vt
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Contract check
        run: ./scripts/verify-libghostty.sh --contract

      - name: Install Zig (checksum-pinned)
        run: |
          set -euo pipefail
          # Extract under RUNNER_TEMP (writable); never sudo or /usr/local.
          python3 <<'PY'
          import hashlib, json, os, platform, subprocess, tarfile, pathlib, sys, urllib.request
          lock = json.load(open("app/modules/zen-terminal-vt/native.lock.json"))
          ver = lock["zig"]["version"]
          machine = platform.machine()
          if machine in ("x86_64", "amd64"):
              key = "x86_64-linux"
          elif machine in ("aarch64", "arm64"):
              key = "aarch64-linux"
          else:
              sys.exit(f"unsupported arch {machine}")
          d = lock["zig"]["downloads"][key]
          url = d["tarball"]
          expect = d["sha256"]
          archive_root = d["archive_root"]
          runner_temp = pathlib.Path(os.environ.get("RUNNER_TEMP") or os.environ.get("TMPDIR") or "/tmp")
          install_root = runner_temp / "zig-install"
          install_root.mkdir(parents=True, exist_ok=True)
          dest = install_root / "zig.tar.xz"
          print(f"Downloading {url}")
          urllib.request.urlretrieve(url, dest)
          h = hashlib.sha256(dest.read_bytes()).hexdigest()
          if h != expect:
              sys.exit(f"zig sha256 mismatch: got {h} want {expect}")
          print(f"ok: zig sha256 {h[:16]}…")
          with tarfile.open(dest, "r:xz") as tar:
              tar.extractall(install_root)
          zig_dir = install_root / archive_root
          zig = zig_dir / "zig"
          if not zig.is_file():
              sys.exit(f"zig binary missing after extract: {zig}")
          github_path = os.environ.get("GITHUB_PATH")
          if github_path:
              with open(github_path, "a", encoding="utf-8") as fh:
                  fh.write(str(zig_dir.resolve()) + "\n")
          got = subprocess.check_output([str(zig), "version"], text=True).strip()
          print(f"zig version: {got}")
          print(f"zig path: {zig.resolve()}")
          if not got.startswith(ver):
              sys.exit(f"zig version mismatch after install: got {got!r} want prefix {ver!r}")
          PY

      - name: Build libraries
        env:
          ZEN_GHOSTTY_CACHE: ${{ runner.temp }}/ghostty
        run: ./scripts/build-libghostty.sh

      - name: Verify libraries (release grade)
        run: ./scripts/verify-libghostty.sh --release && ./scripts/verify-libghostty.sh

      - name: Upload libghostty artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libghostty-vt-android
          path: |
            app/modules/zen-terminal-vt/libs/android/**/libghostty_vt.so
            app/modules/zen-terminal-vt/libs/android/SHA256SUMS
            app/modules/zen-terminal-vt/libs/android/build-manifest.json
            app/modules/zen-terminal-vt/libs/android/GHOSTTY-MIT.txt
            app/assets/notices/GHOSTTY-MIT.txt
          if-no-files-found: error

  build-libghostty-apple:
    name: Build Apple libghostty-vt XCFramework
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Contract check
        run: ./scripts/verify-libghostty.sh --contract

      - name: Install pinned Zig
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib, json, os, platform, tarfile, pathlib, sys, urllib.request
          lock = json.load(open("app/modules/zen-terminal-vt/native.lock.json"))
          machine = platform.machine().lower()
          key = "aarch64-macos" if machine in ("arm64", "aarch64") else "x86_64-macos"
          item = lock["zig"]["downloads"][key]
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "zig-install"
          root.mkdir(parents=True, exist_ok=True)
          archive = root / "zig.tar.xz"
          urllib.request.urlretrieve(item["tarball"], archive)
          actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          if actual != item["sha256"]:
              sys.exit(f"zig sha256 mismatch: {actual} != {item['sha256']}")
          with tarfile.open(archive, "r:xz") as tf:
              tf.extractall(root)
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as fh:
              fh.write(str((root / item["archive_root"]).resolve()) + "\n")
          PY

      - name: Build and verify XCFramework
        env:
          ZEN_GHOSTTY_CACHE: ${{ runner.temp }}/ghostty
        run: ./scripts/build-libghostty-apple.sh

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install app dependencies
        run: bun install --frozen-lockfile

      - name: Generate iOS project and install pods
        run: |
          cd app
          bunx expo prebuild --platform ios --clean --no-install
          cd ios
          pod install

      - name: Compile and link iOS bridge for Apple Silicon simulator
        run: |
          cd app/ios
          set -o pipefail
          xcodebuild \
            -workspace Zen.xcworkspace \
            -scheme Zen \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            build

      - name: Compile and link iOS bridge for arm64 device SDK
        run: |
          cd app/ios
          set -o pipefail
          xcodebuild \
            -workspace Zen.xcworkspace \
            -scheme Zen \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            build

      - name: Upload Apple libghostty artifact
        uses: actions/upload-artifact@v4
        with:
          name: libghostty-vt-apple
          path: |
            app/modules/zen-terminal-vt/libs/apple/ghostty-vt.xcframework/**
            app/modules/zen-terminal-vt/libs/apple/GHOSTTY-MIT.txt
            app/modules/zen-terminal-vt/libs/apple/SHA256SUMS
            app/modules/zen-terminal-vt/libs/apple/build-manifest.json
          if-no-files-found: error
