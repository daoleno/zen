name: iOS signed release

# Published Zen beta prereleases automatically ship the closed Preview identity
# to TestFlight from their immutable tag. Manual dispatch remains available for
# Preview and Production; Production is never selected by a release event.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, tag, or full SHA)"
        required: true
        type: string
      build_number:
        description: "Positive, monotonically increasing CFBundleVersion"
        required: true
        type: string
      app_identity:
        description: "Closed iOS identity: canonical production or temporary Preview"
        required: true
        type: choice
        default: production
        options:
          - production
          - preview
      destination:
        description: "Export only, or explicitly upload the verified IPA to TestFlight"
        required: true
        type: choice
        default: artifact-only
        options:
          - artifact-only
          - testflight

concurrency:
  group: ios-release-${{ github.event_name == 'release' && 'preview' || inputs.app_identity }}-${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  archive:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.release.prerelease == true && startsWith(github.event.release.tag_name, 'v') && contains(github.event.release.tag_name, '-beta.')) }}
    name: Signed archive and IPA
    runs-on: macos-26
    timeout-minutes: 180
    environment: ${{ (github.event_name == 'release' || inputs.app_identity == 'preview') && 'app-store-connect-preview' || 'app-store-connect' }}
    env:
      ZEN_IOS_APP_VARIANT: ${{ github.event_name == 'release' && 'preview' || inputs.app_identity }}
      ZEN_IOS_BUILD_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.build_number || '' }}
      ZEN_IOS_DESTINATION: ${{ github.event_name == 'release' && 'testflight' || inputs.destination }}
      ZEN_IOS_REF: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref }}
      # App IDs are public identifiers. Preview is fixed; production is an
      # environment variable because its App Store Connect record is external.
      ZEN_ASC_APP_ID: ${{ (github.event_name == 'release' || inputs.app_identity == 'preview') && '6790486708' || vars.ZEN_ASC_APP_ID }}
    steps:
      - name: Checkout explicit ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ZEN_IOS_REF }}
          fetch-depth: 0

      - name: Checkout reviewed release automation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .zen-release-automation
          sparse-checkout: scripts/app-store-connect-upload.py
          sparse-checkout-cone-mode: false

      - name: Resolve and validate release invocation
        id: invocation
        env:
          ZEN_RELEASE_TAG: ${{ github.event.release.tag_name }}
          ZEN_RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          ZEN_RELEASE_DRAFT: ${{ github.event.release.draft }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "release" ]]; then
            [[ "$ZEN_RELEASE_PRERELEASE" == "true" && "$ZEN_RELEASE_DRAFT" != "true" ]] || {
              echo "error: automatic iOS publication requires a published prerelease" >&2
              exit 1
            }
            [[ "$ZEN_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]] || {
              echo "error: automatic iOS publication requires a reviewed vX.Y.Z-beta.N tag" >&2
              exit 1
            }
            TAG_COMMIT="$(git rev-parse "refs/tags/${ZEN_RELEASE_TAG}^{}")"
            [[ "$TAG_COMMIT" == "$(git rev-parse HEAD)" ]] || {
              echo "error: checked-out release tag does not resolve to HEAD" >&2
              exit 1
            }
            ZEN_IOS_BUILD_NUMBER="$(python3 - "$ZEN_RELEASE_TAG" <<'PY'
          import json, sys
          base = json.load(open("app/app.base.json", encoding="utf-8"))["expo"]
          ios_release = json.load(open("app/ios-build.json", encoding="utf-8"))
          tag_version = sys.argv[1][1:]
          version = base.get("version")
          ios_build = ios_release.get("buildNumber")
          if version != tag_version:
              raise SystemExit(
                  f"error: release tag version {tag_version!r} does not match tracked version {version!r}"
              )
          if not isinstance(ios_build, int) or isinstance(ios_build, bool) or ios_build < 1:
              raise SystemExit("error: tracked iOS buildNumber must be a positive integer")
          if "buildNumber" in base.get("ios", {}):
              raise SystemExit("error: app.base.json must not duplicate the reviewed iOS build number")
          print(ios_build)
          PY
            )"
            [[ "$ZEN_IOS_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
              echo "error: could not derive the closed automatic build identity" >&2
              exit 1
            }
            echo "Automatic Preview TestFlight publication for $ZEN_RELEASE_TAG build $ZEN_IOS_BUILD_NUMBER"
          else
            [[ "$ZEN_IOS_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
              echo "error: build_number must be a positive integer" >&2
              exit 1
            }
          fi
          echo "ZEN_IOS_BUILD_NUMBER=$ZEN_IOS_BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "build_number=$ZEN_IOS_BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Validate explicit inputs and required signing secrets
        env:
          ZEN_APPLE_CERTIFICATE_BASE64: ${{ secrets.ZEN_APPLE_CERTIFICATE_BASE64 }}
          ZEN_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.ZEN_APPLE_CERTIFICATE_PASSWORD }}
          ZEN_APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.ZEN_APPLE_PROVISIONING_PROFILE_BASE64 }}
          ZEN_APPLE_TEAM_ID: ${{ secrets.ZEN_APPLE_TEAM_ID }}
          ZEN_ASC_KEY_ID: ${{ secrets.ZEN_ASC_KEY_ID }}
          ZEN_ASC_API_KEY_BASE64: ${{ secrets.ZEN_ASC_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          for name in \
            ZEN_APPLE_CERTIFICATE_BASE64 \
            ZEN_APPLE_CERTIFICATE_PASSWORD \
            ZEN_APPLE_PROVISIONING_PROFILE_BASE64 \
            ZEN_APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "error: required app-store-connect environment secret $name is not configured" >&2
              exit 1
            fi
          done
          if [[ "$ZEN_IOS_DESTINATION" == "testflight" ]]; then
            for name in ZEN_ASC_KEY_ID ZEN_ASC_API_KEY_BASE64 ZEN_ASC_APP_ID; do
              if [[ -z "${!name:-}" ]]; then
                echo "error: destination=testflight requires environment configuration $name" >&2
                exit 1
              fi
            done
          fi
          if [[ "$ZEN_IOS_APP_VARIANT" == "preview" && "$ZEN_APPLE_TEAM_ID" != "HD84J3DJ2B" ]]; then
            echo "error: Preview signing material must belong to Apple team HD84J3DJ2B" >&2
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Require Apple build tools
        id: toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          command -v pod >/dev/null || {
            echo "error: CocoaPods is required on the macOS runner" >&2
            exit 1
          }
          TOOLCHAIN_KEY="$( { xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version; pod --version; } | shasum -a 256 | cut -c1-20)"
          echo "cache_key=$TOOLCHAIN_KEY" >> "$GITHUB_OUTPUT"

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Resolve closed iOS identity contract
        run: |
          set -euo pipefail
          node <<'JS'
          const fs = require('fs');
          const createConfig = require('./app/app.config.js');
          const { resolveIOSIdentity } = require('./app/iosIdentity');

          const identity = resolveIOSIdentity(process.env.ZEN_IOS_APP_VARIANT);
          const config = createConfig();
          if (
            config.name !== identity.nativeProjectName ||
            config.ios.bundleIdentifier !== identity.bundleIdentifier ||
            config.ios.infoPlist.CFBundleDisplayName !== identity.displayName ||
            config.ios.infoPlist.CFBundleVersion !== config.ios.buildNumber
          ) {
            throw new Error('resolved Expo config mixes iOS identity values');
          }

          const values = {
            ZEN_IOS_DISPLAY_NAME: identity.displayName,
            ZEN_IOS_BUNDLE_ID: identity.bundleIdentifier,
            ZEN_IOS_NATIVE_PROJECT_NAME: identity.nativeProjectName,
            ZEN_IOS_ARTIFACT_NAME: identity.artifactName,
            ZEN_IOS_VERSION: config.ios.infoPlist.CFBundleShortVersionString,
          };
          const lines = Object.entries(values).map(([key, value]) => {
            if (!value || /[\r\n]/.test(value)) throw new Error(`unsafe or empty ${key}`);
            return `${key}=${value}`;
          });
          fs.appendFileSync(process.env.GITHUB_ENV, `${lines.join('\n')}\n`);
          JS

      - name: Verify tracked release identity
        run: ./scripts/verify-release-identity.sh

      - name: Verify shared native contract
        run: ./scripts/verify-libghostty.sh --contract

      - name: Restore pinned Zig and Ghostty source caches
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/zen-tools
            ${{ runner.temp }}/ghostty
          key: zen-ios-native-inputs-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cache_key }}-${{ hashFiles('app/modules/zen-terminal-vt/native.lock.json', 'scripts/build-libghostty-ios.sh', 'scripts/zig-xcode-compat/**') }}

      - name: Restore verified iOS Ghostty output
        id: ghostty-output-cache
        uses: actions/cache@v4
        with:
          path: app/modules/zen-terminal-vt/libs/ios
          key: zen-ios-ghostty-output-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cache_key }}-${{ hashFiles('app/modules/zen-terminal-vt/native.lock.json', 'scripts/build-libghostty-ios.sh', 'scripts/verify-libghostty-ios.sh', 'app/assets/notices/GHOSTTY-MIT.txt') }}

      - name: Build and verify iOS Ghostty XCFramework
        if: ${{ steps.ghostty-output-cache.outputs.cache-hit != 'true' }}
        env:
          ZEN_GHOSTTY_CACHE: ${{ runner.temp }}/ghostty
          ZEN_TOOL_CACHE: ${{ runner.temp }}/zen-tools
        run: ./scripts/build-libghostty-ios.sh

      - name: Verify iOS Ghostty XCFramework
        run: ./scripts/verify-libghostty-ios.sh

      - name: Restore CocoaPods download cache
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: zen-cocoapods-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cache_key }}-${{ hashFiles('bun.lock', 'app/package.json', 'app/app.config.js', 'app/ios-build.json', 'app/plugins/withZenIOSBuild.js', 'app/modules/zen-terminal-vt/ZenTerminalVt.podspec') }}

      - name: Generate release project and install pods
        run: |
          set -euo pipefail
          cd app
          bunx expo prebuild --platform ios --clean --no-install
          cd ios
          pod install

      - name: Import distribution certificate and provisioning profile
        id: signing
        env:
          CERTIFICATE_PATH: ${{ runner.temp }}/zen-distribution.p12
          PROFILE_PATH: ${{ runner.temp }}/zen-app-store.mobileprovision
          PROFILE_PLIST: ${{ runner.temp }}/zen-app-store.plist
          KEYCHAIN_PATH: ${{ runner.temp }}/zen-signing.keychain-db
          ZEN_APPLE_CERTIFICATE_BASE64: ${{ secrets.ZEN_APPLE_CERTIFICATE_BASE64 }}
          ZEN_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.ZEN_APPLE_CERTIFICATE_PASSWORD }}
          ZEN_APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.ZEN_APPLE_PROVISIONING_PROFILE_BASE64 }}
          ZEN_APPLE_TEAM_ID: ${{ secrets.ZEN_APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os, pathlib
          for env_name, path_name in (
              ("ZEN_APPLE_CERTIFICATE_BASE64", "CERTIFICATE_PATH"),
              ("ZEN_APPLE_PROVISIONING_PROFILE_BASE64", "PROFILE_PATH"),
          ):
              try:
                  data = base64.b64decode(os.environ[env_name], validate=True)
              except Exception as exc:
                  raise SystemExit(f"error: {env_name} is not valid base64: {exc}")
              if not data:
                  raise SystemExit(f"error: {env_name} decoded to an empty file")
              path = pathlib.Path(os.environ[path_name])
              path.write_bytes(data)
              path.chmod(0o600)
          PY

          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$ZEN_APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q 'Apple Distribution' || {
            echo "error: imported PKCS#12 has no Apple Distribution signing identity" >&2
            exit 1
          }

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          python3 - "$PROFILE_PLIST" "$GITHUB_OUTPUT" <<'PY'
          import datetime, os, plistlib, sys
          profile = plistlib.load(open(sys.argv[1], "rb"))
          expected_team = os.environ["ZEN_APPLE_TEAM_ID"]
          expected_bundle = os.environ["ZEN_IOS_BUNDLE_ID"]
          teams = profile.get("TeamIdentifier") or []
          if teams != [expected_team]:
              raise SystemExit(f"error: provisioning profile team does not match ZEN_APPLE_TEAM_ID")
          entitlements = profile.get("Entitlements") or {}
          app_identifier = entitlements.get("application-identifier", "")
          if app_identifier != f"{expected_team}.{expected_bundle}":
              raise SystemExit(f"error: provisioning profile is not for {expected_bundle}")
          if entitlements.get("get-task-allow") is not False:
              raise SystemExit("error: provisioning profile is a development profile, not App Store distribution")
          if entitlements.get("beta-reports-active") is not True:
              raise SystemExit("error: provisioning profile is not eligible for App Store Connect/TestFlight")
          expiration = profile.get("ExpirationDate")
          now = datetime.datetime.now(datetime.timezone.utc)
          if not expiration or expiration.replace(tzinfo=datetime.timezone.utc) <= now:
              raise SystemExit("error: provisioning profile is expired")
          values = {"profile_name": profile.get("Name"), "profile_uuid": profile.get("UUID")}
          if not all(values.values()):
              raise SystemExit("error: provisioning profile has no Name or UUID")
          with open(sys.argv[2], "a", encoding="utf-8") as output:
              for key, value in values.items():
                  if "\n" in value or "\r" in value:
                      raise SystemExit(f"error: unsafe newline in provisioning profile {key}")
                  output.write(f"{key}={value}\n")
          PY
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

      - name: Archive and export signed IPA
        env:
          ARCHIVE_PATH: ${{ runner.temp }}/Zen.xcarchive
          EXPORT_PATH: ${{ runner.temp }}/zen-ios-export
          EXPORT_OPTIONS: ${{ runner.temp }}/ExportOptions.plist
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
          ZEN_APPLE_TEAM_ID: ${{ secrets.ZEN_APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          set -o pipefail
          python3 - "$EXPORT_OPTIONS" "$ZEN_APPLE_TEAM_ID" "$PROFILE_NAME" <<'PY'
          import os, plistlib, sys
          options = {
              "method": "app-store-connect",
              "destination": "export",
              "signingStyle": "manual",
              "signingCertificate": "Apple Distribution",
              "teamID": sys.argv[2],
              "provisioningProfiles": {os.environ["ZEN_IOS_BUNDLE_ID"]: sys.argv[3]},
              "manageAppVersionAndBuildNumber": False,
              "stripSwiftSymbols": True,
              "uploadSymbols": True,
          }
          with open(sys.argv[1], "wb") as output:
              plistlib.dump(options, output)
          PY
          xcodebuild \
            -workspace "app/ios/${ZEN_IOS_NATIVE_PROJECT_NAME}.xcworkspace" \
            -scheme "$ZEN_IOS_NATIVE_PROJECT_NAME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$ZEN_APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive
          test -d "$ARCHIVE_PATH"
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS"
          mapfile_supported=false
          if builtin help mapfile >/dev/null 2>&1; then mapfile_supported=true; fi
          if [[ "$mapfile_supported" == true ]]; then
            mapfile -t IPAS < <(find "$EXPORT_PATH" -maxdepth 1 -type f -name '*.ipa')
          else
            IPAS=()
            while IFS= read -r ipa; do IPAS+=("$ipa"); done < <(find "$EXPORT_PATH" -maxdepth 1 -type f -name '*.ipa')
          fi
          [[ ${#IPAS[@]} -eq 1 ]] || {
            echo "error: expected exactly one exported IPA, found ${#IPAS[@]}" >&2
            exit 1
          }
          ./scripts/verify-ios-artifact.sh ipa "${IPAS[0]}"
          ARTIFACT_DIR="${{ runner.temp }}/zen-ios-release-artifact"
          mkdir -p "$ARTIFACT_DIR"
          IPA="$ARTIFACT_DIR/${ZEN_IOS_ARTIFACT_NAME}-v${ZEN_IOS_VERSION}-build${ZEN_IOS_BUILD_NUMBER}.ipa"
          cp "${IPAS[0]}" "$IPA"
          python3 - "$IPA" "$ARTIFACT_DIR/release-manifest.json" <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys
          ipa = pathlib.Path(sys.argv[1])
          ipa_digest = hashlib.sha256()
          with ipa.open("rb") as source:
              for chunk in iter(lambda: source.read(1024 * 1024), b""):
                  ipa_digest.update(chunk)
          manifest = {
              "schema_version": 1,
              "platform": "ios",
              "distribution": "app-store-connect",
              "app_identity": os.environ["ZEN_IOS_APP_VARIANT"],
              "display_name": os.environ["ZEN_IOS_DISPLAY_NAME"],
              "bundle_identifier": os.environ["ZEN_IOS_BUNDLE_ID"],
              "marketing_version": os.environ["ZEN_IOS_VERSION"],
              "build_number": os.environ["ZEN_IOS_BUILD_NUMBER"],
              "git_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "ipa": ipa.name,
              "ipa_sha256": ipa_digest.hexdigest(),
          }
          pathlib.Path(sys.argv[2]).write_text(json.dumps(manifest, indent=2) + "\n")
          PY
          (cd "$ARTIFACT_DIR" && shasum -a 256 "$(basename "$IPA")" > SHA256SUMS)
          (cd "$ARTIFACT_DIR" && shasum -a 256 -c SHA256SUMS)
          echo "IOS_IPA=$IPA" >> "$GITHUB_ENV"
          echo "IOS_ARTIFACT_DIR=$ARTIFACT_DIR" >> "$GITHUB_ENV"

      - name: Upload verified signed IPA as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZEN_IOS_ARTIFACT_NAME }}-signed-${{ steps.invocation.outputs.build_number }}
          path: ${{ env.IOS_ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload verified IPA to TestFlight
        if: ${{ env.ZEN_IOS_DESTINATION == 'testflight' }}
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/zen-asc-individual-key.p8
          ZEN_ASC_KEY_ID: ${{ secrets.ZEN_ASC_KEY_ID }}
          ZEN_ASC_API_KEY_BASE64: ${{ secrets.ZEN_ASC_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          python3 - "$ASC_KEY_PATH" <<'PY'
          import base64, os, pathlib, sys
          try:
              data = base64.b64decode(os.environ["ZEN_ASC_API_KEY_BASE64"], validate=True)
          except Exception as exc:
              raise SystemExit(f"error: ZEN_ASC_API_KEY_BASE64 is not valid base64: {exc}")
          if not data:
              raise SystemExit("error: ZEN_ASC_API_KEY_BASE64 decoded to an empty file")
          path = pathlib.Path(sys.argv[1])
          path.write_bytes(data)
          path.chmod(0o600)
          PY
          EXTRA_ARGS=()
          if [[ "$ZEN_IOS_APP_VARIANT" == "preview" ]]; then
            EXTRA_ARGS=(--reuse-existing-build --beta-group-name "Zen Preview" --submit-beta-review)
          fi
          ./.zen-release-automation/scripts/app-store-connect-upload.py \
            --ipa "$IOS_IPA" \
            --app-id "$ZEN_ASC_APP_ID" \
            --version "$ZEN_IOS_VERSION" \
            --build-number "$ZEN_IOS_BUILD_NUMBER" \
            --key-id "$ZEN_ASC_KEY_ID" \
            --key-path "$ASC_KEY_PATH" \
            "${EXTRA_ARGS[@]}"

      - name: Remove temporary signing material
        if: always()
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/zen-signing.keychain-db
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
        run: |
          set +e
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          if [[ -n "${PROFILE_UUID:-}" ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          fi
          rm -f \
            "${{ runner.temp }}/zen-distribution.p12" \
            "${{ runner.temp }}/zen-app-store.mobileprovision" \
            "${{ runner.temp }}/zen-app-store.plist" \
            "${{ runner.temp }}/zen-asc-individual-key.p8"
