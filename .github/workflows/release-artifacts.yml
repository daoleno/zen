name: Release artifacts

# Secure release pipeline: Linux amd64/arm64, macOS arm64, signed Android arm64 APK.
#
# An annotated vX.Y.Z or vX.Y.Z-beta.N tag push is the normal release action. Manual
# dispatch can rebuild, and can recover publication only with explicit review.
#
# Secrets (GitHub Actions repository secrets only; never commit values):
#   ZEN_ANDROID_KEYSTORE_BASE64
#   ZEN_ANDROID_KEYSTORE_PASSWORD
#   ZEN_ANDROID_KEY_ALIAS
#   ZEN_ANDROID_KEY_PASSWORD
#   ZEN_UPDATE_SIGNING_KEY_BASE64
#
# Docs: docs/ci-release.md

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-beta.*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Exact annotated vX.Y.Z or vX.Y.Z-beta.N tag to rebuild/recover"
        required: true
        type: string
      publish:
        description: "Reviewed recovery: publish/reconcile the matching release"
        required: true
        type: boolean
        default: false

concurrency:
  group: release-artifacts-${{ github.event_name == 'push' && github.ref_name || inputs.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Stable non-secret product constants used in logs
  ZEN_JAVA_VERSION: "17"

jobs:
  validate:
    name: Validate immutable reviewed tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.ref }}
          fetch-depth: 0

      - name: Fetch and validate reviewed release identity
        id: meta
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.ref }}
          PUBLISH: ${{ github.event_name == 'push' && 'true' || inputs.publish }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          ./scripts/verify-release-identity.sh --tag "$RELEASE_TAG"
          VERSION="${RELEASE_TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

  daemon:
    name: Build daemon archives
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0
      - name: Revalidate tag at build boundary
        run: |
          git fetch --no-tags origin main
          ./scripts/verify-release-identity.sh --tag "${{ needs.validate.outputs.tag }}"
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - name: Build daemon binaries once
        env:
          ZEN_VERSION: ${{ needs.validate.outputs.version }}
        run: ./scripts/build-daemon-linux.sh --out-dir "$GITHUB_WORKSPACE/dist-download/staging/bin"
      - name: Verify daemon formats and architectures
        run: |
          set -euo pipefail
          file dist-download/staging/bin/zen-linux-amd64 | grep -Eq 'ELF 64-bit.*(x86-64|x86_64)'
          file dist-download/staging/bin/zen-linux-arm64 | grep -Eq 'ELF 64-bit.*(ARM aarch64|ARM64)'
          file dist-download/staging/bin/zen-darwin-arm64 | grep -Eq 'Mach-O 64-bit.*arm64'
      - name: Upload verified daemon inputs
        uses: actions/upload-artifact@v4
        with:
          name: zen-daemon-binaries-${{ needs.validate.outputs.tag }}
          path: dist-download/staging/bin/zen-*
          if-no-files-found: error

  android:
    needs: validate
    name: Build and verify signed Android
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0

      - name: Revalidate tag at build boundary
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          ./scripts/verify-release-identity.sh --tag "${{ needs.validate.outputs.tag }}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            bun.lock
            app/package.json
            app/app.base.json
            app/plugins/withZenAndroidRelease.js
            app/modules/zen-terminal-vt/android/build.gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"
          # sdkmanager may leave licenses pending
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Restore pinned Zig and Ghostty source caches
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/zen-tools
            ${{ runner.temp }}/ghostty
          key: zen-android-native-inputs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/modules/zen-terminal-vt/native.lock.json', 'app/modules/zen-terminal-vt/patches/android/**', 'scripts/build-libghostty.sh') }}

      - name: Restore verified Android Ghostty output
        id: ghostty-output-cache
        uses: actions/cache@v4
        with:
          path: |
            app/modules/zen-terminal-vt/libs/android
            app/modules/zen-terminal-vt/android/src/main/cpp/ghostty
          key: zen-android-ghostty-output-v2-arm64-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/modules/zen-terminal-vt/native.lock.json', 'app/modules/zen-terminal-vt/patches/android/**', 'scripts/build-libghostty.sh', 'scripts/verify-libghostty.sh', 'scripts/verify-android-native-symbols.py', 'app/assets/notices/GHOSTTY-MIT.txt') }}

      - name: Install Zig (checksum-pinned from native.lock.json)
        run: |
          set -euo pipefail
          # Extract under RUNNER_TEMP (writable); never sudo or /usr/local.
          python3 <<'PY'
          import hashlib, json, os, platform, subprocess, tarfile, pathlib, sys, urllib.request
          lock = json.load(open("app/modules/zen-terminal-vt/native.lock.json"))
          ver = lock["zig"]["version"]
          machine = platform.machine()
          if machine in ("x86_64", "amd64"):
              key = "x86_64-linux"
          elif machine in ("aarch64", "arm64"):
              key = "aarch64-linux"
          else:
              sys.exit(f"unsupported arch {machine}")
          d = lock["zig"]["downloads"][key]
          url = d["tarball"]
          expect = d["sha256"]
          archive_root = d["archive_root"]
          runner_temp = pathlib.Path(os.environ.get("RUNNER_TEMP") or os.environ.get("TMPDIR") or "/tmp")
          install_root = runner_temp / "zen-tools"
          install_root.mkdir(parents=True, exist_ok=True)
          dest = install_root / "zig.tar.xz"
          if not dest.is_file():
              print(f"Downloading {url}")
              urllib.request.urlretrieve(url, dest)
          h = hashlib.sha256(dest.read_bytes()).hexdigest()
          if h != expect:
              sys.exit(f"zig sha256 mismatch: got {h} want {expect}")
          print(f"ok: zig sha256 {h[:16]}…")
          zig_dir = install_root / archive_root
          zig = zig_dir / "zig"
          if not zig.is_file():
              with tarfile.open(dest, "r:xz") as tar:
                  tar.extractall(install_root)
          if not zig.is_file():
              sys.exit(f"zig binary missing after extract: {zig}")
          # Expose directory containing zig for subsequent steps.
          github_path = os.environ.get("GITHUB_PATH")
          if github_path:
              with open(github_path, "a", encoding="utf-8") as fh:
                  fh.write(str(zig_dir.resolve()) + "\n")
          else:
              # Local dry-run fallback
              os.environ["PATH"] = str(zig_dir.resolve()) + os.pathsep + os.environ.get("PATH", "")
          got = subprocess.check_output([str(zig), "version"], text=True).strip()
          print(f"zig version: {got}")
          print(f"zig path: {zig.resolve()}")
          if not got.startswith(ver):
              sys.exit(f"zig version mismatch after install: got {got!r} want prefix {ver!r}")
          PY

      - name: Confirm Zig on PATH
        run: |
          set -euo pipefail
          command -v zig
          zig version

      - name: Build release-grade libghostty (arm64-v8a)
        if: ${{ steps.ghostty-output-cache.outputs.cache-hit != 'true' }}
        env:
          ZEN_GHOSTTY_CACHE: ${{ runner.temp }}/ghostty
        run: |
          set -euo pipefail
          command -v zig
          # The sideload release ships arm64 only; --release enforces release_grade + arm64.
          # Do not run bare verify-libghostty.sh here (that requires dual-ABI lock ABIs).
          ./scripts/build-libghostty.sh --abis arm64-v8a
          ./scripts/verify-libghostty.sh --release

      - name: Verify release-grade libghostty (arm64-v8a)
        run: ./scripts/verify-libghostty.sh --release

      - name: Materialize signing keystore (temp, mode 0600)
        id: keystore
        env:
          ZEN_ANDROID_KEYSTORE_BASE64: ${{ secrets.ZEN_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${ZEN_ANDROID_KEYSTORE_BASE64:-}" ]]; then
            echo "error: repository secret ZEN_ANDROID_KEYSTORE_BASE64 is not set" >&2
            exit 1
          fi
          KS_PATH="${{ runner.temp }}/zen-release.p12"
          export ZEN_ANDROID_KEYSTORE="$KS_PATH"
          # Script prints only the path; never logs secret material
          OUT="$(./scripts/materialize-android-keystore.sh)"
          # Do not echo path if it could be sensitive; it is a runner temp path (ok).
          echo "keystore_path=${OUT}" >> "$GITHUB_OUTPUT"
          # sanity: file exists and is non-empty without printing contents
          test -s "$OUT"
          stat -c '%a %n' "$OUT"

      - name: Build signed Android arm64 release APK
        env:
          ZEN_ANDROID_KEYSTORE: ${{ steps.keystore.outputs.keystore_path }}
          ZEN_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ZEN_ANDROID_KEYSTORE_PASSWORD }}
          ZEN_ANDROID_KEY_ALIAS: ${{ secrets.ZEN_ANDROID_KEY_ALIAS }}
          ZEN_ANDROID_KEY_PASSWORD: ${{ secrets.ZEN_ANDROID_KEY_PASSWORD }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
        run: |
          set -euo pipefail
          for v in ZEN_ANDROID_KEYSTORE_PASSWORD ZEN_ANDROID_KEY_ALIAS ZEN_ANDROID_KEY_PASSWORD; do
            if [[ -z "${!v:-}" ]]; then
              echo "error: repository secret $v is not set" >&2
              exit 1
            fi
          done
          test -f "${ZEN_ANDROID_KEYSTORE}"
          ./scripts/android-release-apk.sh
          # Locate APK produced under dist-download/android-native
          APK="$(ls -t dist-download/android-native/zen-android-arm64-*.apk | head -1)"
          test -f "$APK"
          echo "APK_PATH=${APK}" >> "$GITHUB_ENV"

      - name: Verify signed APK (package, ABI, notice, certificate)
        run: |
          set -euo pipefail
          ./scripts/verify-apk-release.sh "${APK_PATH}"

      - name: Shred temporary keystore
        if: always()
        run: |
          set -euo pipefail
          KS="${{ steps.keystore.outputs.keystore_path }}"
          if [[ -n "${KS}" && -f "${KS}" ]]; then
            shred -u "${KS}" 2>/dev/null || rm -f "${KS}"
          fi
          # Ensure env materialization helpers leave no base64 on disk from this step
          rm -f "${{ runner.temp }}/zen-release.p12" || true

      - name: Upload verified signed APK
        uses: actions/upload-artifact@v4
        with:
          name: zen-android-apk-${{ needs.validate.outputs.tag }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

  aggregate:
    name: Aggregate, sign, and verify complete asset set
    needs: [validate, daemon, android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0
      - name: Revalidate tag before signing
        run: |
          git fetch --no-tags origin main
          ./scripts/verify-release-identity.sh --tag "${{ needs.validate.outputs.tag }}"
      - name: Download daemon binaries
        uses: actions/download-artifact@v4
        with:
          name: zen-daemon-binaries-${{ needs.validate.outputs.tag }}
          path: dist-download/staging/bin
      - name: Download signed Android APK
        uses: actions/download-artifact@v4
        with:
          name: zen-android-apk-${{ needs.validate.outputs.tag }}
          path: inputs/android
      - name: Deterministically stage, sign, and verify
        env:
          ZEN_UPDATE_SIGNING_KEY_BASE64: ${{ secrets.ZEN_UPDATE_SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          APK="$(find inputs/android -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          ./scripts/verify-apk-release.sh "$APK"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          ./scripts/stage-release.sh --skip-build --apk "$APK"
          STAGE="dist-download/${{ needs.validate.outputs.tag }}"
          ./scripts/verify-release-identity.sh --tag "${{ needs.validate.outputs.tag }}" --stage "$STAGE"
          (cd "$STAGE" && sha256sum -c SHA256SUMS)
      - name: Upload complete verified stage
        uses: actions/upload-artifact@v4
        with:
          name: zen-release-stage-${{ needs.validate.outputs.tag }}
          path: dist-download/${{ needs.validate.outputs.tag }}
          if-no-files-found: error

  publish:
    name: Reconcile draft and publish release
    needs: [validate, aggregate]
    if: ${{ needs.validate.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout exact tag and tracked notes
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0
      - name: Revalidate immutable tag before external publication
        run: |
          git fetch --no-tags origin main
          ./scripts/verify-release-identity.sh --tag "${{ needs.validate.outputs.tag }}"
      - name: Download stage artifact
        uses: actions/download-artifact@v4
        with:
          name: zen-release-stage-${{ needs.validate.outputs.tag }}
          path: stage

      - name: Create/reuse safe draft, upload, verify, and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          test -n "${GH_REPO:-}"
          if [[ "$TAG" == *-beta.* ]]; then
            RELEASE_IS_PRERELEASE=true
            RELEASE_IS_STABLE=false
          else
            RELEASE_IS_PRERELEASE=false
            RELEASE_IS_STABLE=true
          fi
          notes="docs/releases/${TAG}.md"
          test -s "$notes"
          if ! meta="$(gh release view "$TAG" --json isPrerelease,isDraft,url 2>/dev/null)"; then
            gh release create "$TAG" --verify-tag --draft \
              --prerelease="$RELEASE_IS_PRERELEASE" \
              --latest="$RELEASE_IS_STABLE" \
              --title "Zen $TAG" --notes-file "$notes"
            meta="$(gh release view "$TAG" --json isPrerelease,isDraft,url)"
          fi
          is_pre="$(echo "$meta" | python3 -c 'import json,sys; print(json.load(sys.stdin)["isPrerelease"])')"
          is_draft="$(echo "$meta" | python3 -c 'import json,sys; print(json.load(sys.stdin)["isDraft"])')"
          actual_pre="$(printf '%s' "$is_pre" | tr '[:upper:]' '[:lower:]')"
          if [[ "$actual_pre" != "$RELEASE_IS_PRERELEASE" ]]; then
            echo "error: existing $TAG release prerelease state is $actual_pre; expected $RELEASE_IS_PRERELEASE" >&2
            exit 1
          fi
          cd stage
          assets=(
            zen-linux-amd64.tar.gz
            zen-linux-arm64.tar.gz
            zen-darwin-arm64.tar.gz
            "zen-android-arm64-v${VERSION}.apk"
            SHA256SUMS
            release-manifest.json
            release-manifest.json.sig
          )
          for f in "${assets[@]}"; do
            test -s "$f" || { echo "error: missing/empty staged asset $f" >&2; exit 1; }
          done
          gh release upload "$TAG" "${assets[@]}" --clobber
          expected="$(printf '%s\n' "${assets[@]}" | LC_ALL=C sort)"
          actual="$(gh release view "$TAG" --json assets --jq '.assets[] | select(.size > 0) | .name' | LC_ALL=C sort)"
          [[ "$actual" == "$expected" ]] || {
            echo "error: uploaded non-empty asset set does not exactly match expected set" >&2
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          }
          if [[ "$is_draft" == "True" || "$is_draft" == "true" ]]; then
            gh release edit "$TAG" --draft=false \
              --prerelease="$RELEASE_IS_PRERELEASE" \
              --latest="$RELEASE_IS_STABLE" \
              --notes-file "../$notes"
          else
            gh release edit "$TAG" \
              --prerelease="$RELEASE_IS_PRERELEASE" \
              --latest="$RELEASE_IS_STABLE" \
              --notes-file "../$notes"
          fi
          gh release view "$TAG" --json isDraft,isPrerelease,url,assets
