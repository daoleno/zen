apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

group = 'expo.modules.zenremotedesktop'
version = '0.1.0'

/**
 * ABIs supported by the pinned moonlight-common-c core, intersected with the
 * React Native architectures property. Sources are compiled from
 * third_party/moonlight-common-c (scripts/fetch-moonlight-common-c.sh); the
 * only prebuilt dependency is the pinned OpenSSL prefix built by
 * scripts/build-openssl-android.sh.
 */
List<String> zenRemoteDesktopAbis() {
  final List<String> supported = ['arm64-v8a', 'x86_64'].asImmutable()
  def raw = project.findProperty('reactNativeArchitectures')
  if (raw == null || raw.toString().trim().isEmpty()) {
    return new ArrayList<>(supported)
  }
  def requested = raw.toString().split(',').collect { it.trim() }.findAll { it }
  List<String> selected = requested.findAll { supported.contains(it) }
  if (selected.isEmpty()) {
    throw new GradleException(
      "zen-remote-desktop: reactNativeArchitectures=${raw} selects no supported ABIs. " +
        "Supported: ${supported}."
    )
  }
  return selected
}

def resolvedAbis = zenRemoteDesktopAbis()
logger.lifecycle("zen-remote-desktop: ndk abiFilters=${resolvedAbis}")

// Host JVM lifecycle tests link the real bridge against the inert core.
// Enabled only when explicitly requested so normal app builds never depend on
// a host toolchain: ZEN_MOONLIGHT_BRIDGE_TEST=1 ./gradlew :zen-remote-desktop:testDebugUnitTest
def zenBridgeTestEnabled = project.hasProperty('zenMoonlightBridgeTest') ||
  System.getenv('ZEN_MOONLIGHT_BRIDGE_TEST') == '1'
def zenRepoRoot = file("${rootProject.projectDir}/../..")
def zenBridgeTestLib = new File(zenRepoRoot, 'build/zen-moonlight-bridge-test/libzen_moonlight_test.so')

tasks.register('buildMoonlightBridgeTestLib', Exec) {
  group = 'verification'
  description = 'Builds libzen_moonlight_test.so for host JVM bridge lifecycle tests.'
  onlyIf { zenBridgeTestEnabled }
  workingDir zenRepoRoot
  commandLine 'bash', new File(zenRepoRoot, 'scripts/build-moonlight-bridge-test.sh').absolutePath, zenBridgeTestLib.parentFile.absolutePath
  inputs.files(
    new File(zenRepoRoot, 'scripts/build-moonlight-bridge-test.sh'),
    new File(zenRepoRoot, 'scripts/fetch-moonlight-common-c.sh'),
    new File(project.projectDir, 'CMakeLists.txt'),
    new File(project.projectDir, 'src/main/cpp/moonlight_bridge.c'),
    new File(project.projectDir, 'src/test/cpp/moonlight_fake_core.c'),
  )
  outputs.file zenBridgeTestLib
}

android {
  namespace 'expo.modules.zenremotedesktop'
  compileSdk rootProject.ext.has('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 35
  ndkVersion rootProject.ext.has('ndkVersion') ? rootProject.ext.ndkVersion : '27.1.12297006'

  defaultConfig {
    minSdk rootProject.ext.has('minSdkVersion') ? rootProject.ext.minSdkVersion : 24

    externalNativeBuild {
      cmake {
        arguments '-DANDROID_STL=none'
      }
    }

    ndk {
      abiFilters(*resolvedAbis)
    }
  }

  externalNativeBuild {
    cmake {
      path 'CMakeLists.txt'
      version '3.22.1'
    }
  }

  testOptions {
    unitTests.all { unitTest ->
      unitTest.systemProperty 'zen.moonlight.bridge.test.lib', zenBridgeTestLib.absolutePath
      unitTest.dependsOn tasks.named('buildMoonlightBridgeTestLib')
    }
  }

  sourceSets.main.assets.srcDirs += file('../notices')
}

dependencies {
  implementation project(':expo-modules-core')
  implementation project(':zen-link-transport')
  implementation 'com.facebook.react:react-android'
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
  // Upstream Moonlight application-layer pairing/certificate crypto
  // (moonlight-android@98c12beb uses these exact artifacts).
  implementation 'org.bouncycastle:bcprov-jdk18on:1.85.2'
  implementation 'org.bouncycastle:bcpkix-jdk18on:1.85'
  testImplementation 'junit:junit:4.13.2'
}
