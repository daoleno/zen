apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

group = 'expo.modules.zenterminalvt'
version = '0.1.0'

/**
 * Resolve NDK ABIs from the React Native / Expo architectures property.
 *
 * Supported ABIs stay aligned with native.lock.json: arm64-v8a, x86_64.
 *
 * - When -PreactNativeArchitectures=arm64-v8a (release APK): only arm64-v8a.
 * - When unset (typical local/emulator multi-ABI host builds): all supported ABIs.
 * - When set to a list: intersection with supported ABIs only; empty intersection fails.
 *
 * No silent substitution of missing architectures. Missing prebuilt .so for a
 * selected ABI fails the configuration phase with an explicit path.
 *
 * Note: supported ABIs are local to this method (not script-level def). Gradle
 * Script methods cannot capture script-local def bindings (CI failure mode).
 */
List<String> zenTerminalAbis() {
  // Keep list local — do not use script-level def for method capture.
  final List<String> supported = ['arm64-v8a', 'x86_64'].asImmutable()
  def raw = project.findProperty('reactNativeArchitectures')
  List<String> selected
  if (raw == null || raw.toString().trim().isEmpty()) {
    selected = new ArrayList<>(supported)
  } else {
    def requested = raw.toString().split(',').collect { it.trim() }.findAll { it }
    selected = requested.findAll { supported.contains(it) }
    if (selected.isEmpty()) {
      throw new GradleException(
        "zen-terminal-vt: reactNativeArchitectures=${raw} selects no supported ABIs. " +
          "Supported: ${supported}. " +
          "Release builds must pass -PreactNativeArchitectures=arm64-v8a."
      )
    }
  }
  // Fail fast if prebuilt lib missing for a selected ABI (no empty CMake import).
  selected.each { abi ->
    def so = file("${project.projectDir}/../libs/android/${abi}/libghostty_vt.so")
    if (!so.isFile()) {
      throw new GradleException(
        "zen-terminal-vt: missing ${so}. " +
          "Build it with: ./scripts/build-libghostty.sh --abis ${abi} " +
          "or exclude this ABI via -PreactNativeArchitectures (release: arm64-v8a only)."
      )
    }
  }
  return selected
}

def resolvedAbis = zenTerminalAbis()
logger.lifecycle("zen-terminal-vt: ndk abiFilters=${resolvedAbis} (reactNativeArchitectures=${project.findProperty('reactNativeArchitectures')})")

android {
  namespace "expo.modules.zenterminalvt"
  compileSdk safeExtGet("compileSdkVersion", 35)
  ndkVersion safeExtGet("ndkVersion", "27.1.12297006")

  defaultConfig {
    minSdk safeExtGet("minSdkVersion", 26)
    targetSdk safeExtGet("targetSdkVersion", 35)

    externalNativeBuild {
      cmake {
        cppFlags "-std=c++17"
        arguments "-DANDROID_STL=c++_shared"
      }
    }

    ndk {
      abiFilters(*resolvedAbis)
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
      version "3.22.1"
    }
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    abortOnError false
  }

  publishing {
    singleVariant("release") {
      withSourcesJar()
    }
  }

  sourceSets {
    main {
      jniLibs.srcDirs = ["${project.projectDir}/../libs/android"]
    }
  }
}

repositories {
  mavenCentral()
}

dependencies {
  implementation project(':expo-modules-core')
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}
